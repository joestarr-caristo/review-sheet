<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Review Spreadsheet</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 5px;
    }

    input,
    select,
    button {
      padding: 8px;
      margin-right: 10px;
      margin-bottom: 10px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<h3>Review Spreadsheet</h3>

<input id="docName" placeholder="Enter case ID" />

<select id="templateType">
  <option value="" disabled selected hidden>Select template</option>
  <option value="standard">Standard Template</option>
  <option value="paired">Paired Template</option>
  <option value="novo">Novo Paired Template</option>
<option value="novo1">Novo Single Timepoint Template</option>
</select>
<button id="createBtn" onclick="createDoc()">Create</button>

<p id="result"></p>

<script>

let loadingInterval;

async function createDoc() {

  const name = document.getElementById("docName").value.trim();
  const templateType = document.getElementById("templateType").value;

  const result = document.getElementById("result");
  const button = document.getElementById("createBtn");

  // Validation
  if (!name) {
    alert("Please enter case ID");
    return;
  }

  if (!templateType) {
    alert("Please select a template");
    return;
  }

  // Webhook URLs
  const webhookUrls = {

    standard:
      "https://defaultd2d5a7da0ed94596840e63695c39f6.86.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/7a17b7557f414bc2a4a8ca64b8502b00/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=jr_DGykVYbpCUrgMJrt8NhyMVtmVd81AvV95vlWldL0",

    paired:
      "https://defaultd2d5a7da0ed94596840e63695c39f6.86.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/f25a989131e74f8b9f2a557154ddd347/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=H9S05d8DsRvgfuIsVBvT3kGh1xqbK2GuWHNbxl4IHvc",

    novo:
      "https://defaultd2d5a7da0ed94596840e63695c39f6.86.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/3b6a1dfd475d4aa4ae29fc879a71df08/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=weeRVPTfO8xpS_ZAPr8l3xbSQN9W5sd7GL7zQ_o5VP4"
    
novo1:
      "https://defaultd2d5a7da0ed94596840e63695c39f6.86.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/ee2f211c2c4a49d6aa08f145766382f4/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=-SdiRP1Wd264lqchwP5IN_vSIEJB-TIbhXrWVOnxfvo"
  
};

  // Loading animation
  let dots = 0;

  result.textContent = "Creating document";

  loadingInterval = setInterval(() => {

    dots = (dots + 1) % 4;

    result.textContent =
      "Creating document" + ".".repeat(dots);

  }, 500);

  button.disabled = true;

  try {

    // Trigger Power Automate flow
    await fetch(webhookUrls[templateType], {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        filename: name,
        template: templateType
      })

    });

    // Encode filename safely for URL
    const encodedName = encodeURIComponent(name);

    // SharePoint output URLs
    const outputUrls = {

      standard:
        `https://caristodiagnostics.sharepoint.com/Shared%20Documents%2FImage%20Analysis%2FIA%20-%20UK%2F%28PERP%29%20Plaque%20Escalation%20Review%20Process%2FCase%20Reviews/${encodedName}.xlsm?web=1`,

      paired:
        `https://caristodiagnostics.sharepoint.com/Shared%20Documents%2FImage%20Analysis%2FIA%20-%20UK%2F%28PERP%29%20Plaque%20Escalation%20Review%20Process%2FCase%20Reviews/${encodedName}.xlsx?web=1`,

      novo:
        `https://caristodiagnostics.sharepoint.com/Shared%20Documents%2FImage%20Analysis%2FIA%20-%20UK%2F%28PERP%29%20Plaque%20Escalation%20Review%20Process%2FCase%20Reviews/${encodedName}.xlsx?web=1`
    };

    const url = outputUrls[templateType];

    // Show link
    result.innerHTML =
      `<a href="${url}" target="_blank">Open spreadsheet</a>`;

  } catch (err) {

    result.textContent = "Error creating document";

    console.error(err);

  } finally {

    clearInterval(loadingInterval);

    button.disabled = false;

  }
}

</script>

</body>
</html>
